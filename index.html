<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeBug - Hybrid AI Debugger</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1e1e1e; color: #fff; padding: 40px; }
        .container { max-width: 700px; margin: auto; background: #2d2d2d; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        textarea { width: 100%; height: 150px; background: #1e1e1e; color: #0ff; border: 1px solid #444; border-radius: 6px; padding: 12px; font-family: monospace; font-size: 14px; margin-top: 10px; }
        button { background: #007acc; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; margin-top: 15px; }
        button:hover { background: #005999; }
        .output { background: #1e1e1e; border: 1px solid #444; padding: 15px; border-radius: 6px; margin-top: 20px; white-space: pre-wrap; font-family: monospace; color: #ce9178; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🛡️ SafeBug: Hybrid AI Debugger</h2>
        <p>Paste your buggy code below for local privacy-first debugging via Gemini Nano:</p>
        <textarea id="codeInput" placeholder="// Paste code snippet here..."></textarea>
        <br>
        <button id="debugBtn">Debug with Local AI</button>
        <button id="cloudDebugBtn" type="button">Deep Audit with Cloud AI</button>
        <button id="smartDebugBtn" style="background-color: #10b981;">⚡ Smart Hybrid Debug</button>
        <div class="output" id="outputBox">AI response will appear here...</div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="config.local.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
